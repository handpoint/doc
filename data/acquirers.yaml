# Handpoint acquirer capabilities — source of truth for generated pages.
# Edit this file, then run: node scripts/generate-acquirer-pages.js
#
# Capability values per integration path:
#   public       — documented with code example
#   coming-soon  — announced, no code shown yet
#   not-supported — cannot work on this path (e.g. MOTO on physical terminal)
#   (absent)     — acquirer does not support this capability at all

acquirers:

  epi:
    name: "EPI"
    geography: "US, Canada"
    status: active
    card-brands: [VISA, MC, Discover]
    interac: false
    reversal-partial: true
    notes: >
      EPI (formerly TSYS). Batch auto-closes ~11pm EST (host-capture). Partial
      reversal available for US and Canada — uses the MasterCard flag in ISO 8583.
      Tip adjustment only available on transactions processed without an on-screen tip
      (tip-at-table flow).
    capabilities:
      sale:
        cloud-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public
        flavors:
          emv-sale:
