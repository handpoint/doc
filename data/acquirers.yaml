# Handpoint acquirer capabilities — source of truth for generated pages.
# Edit this file, then run: node scripts/generate-acquirer-pages.js
#
# Capability values per integration path:
#   public       — documented with code example
#   coming-soon  — announced, no code shown yet
#   not-supported — cannot work on this path (e.g. MOTO on physical terminal)
#   (absent)     — acquirer does not support this capability at all

acquirers:

  tsys:
    name: "TSYS"
    geography: "US, Canada"
    status: active
    card-brands: [VISA, MC, Discover]
    interac: false
    notes: >
      Batch auto-closes ~11pm EST (US, host-capture). Partial reversal is US-only —
      uses the MasterCard flag in ISO 8583. Batching is US-only; not available for
      Canadian merchants.
    capabilities:
      sale:
        rest-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public
      refund:
        rest-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public
      reversal:
        rest-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public
      partial-reversal:
        rest-api: public
        android-pax: not-supported
        android-hilite: not-supported
        ios-hilite: not-supported
        cordova: not-supported
      tip-adjustment:
        rest-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: not-supported
        cordova: public
      pre-auth:
        rest-api: public
        android-pax: public
        android-hilite: coming-soon
        ios-hilite: coming-soon
        cordova: public
      moto:
        rest-api: public
        android-pax: not-supported
        android-hilite: not-supported
        ios-hilite: not-supported
        cordova: not-supported
      tokenization:
        rest-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public
      batching:
        rest-api: public
        android-pax: not-supported
        android-hilite: not-supported
        ios-hilite: not-supported
        cordova: not-supported
      money-remittance:
        rest-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public

  tsys-tns:
    name: "TSYS + TNS"
    geography: "Canada"
    status: active
    card-brands: [VISA, MC, Discover, Interac]
    interac: true
    notes: >
      Gateway routes automatically: Interac cards go to TNS, all other cards go to TSYS.
      IMPORTANT for ISVs: for Interac card transactions, show a VOID button — not Refund
      or Reverse. The only post-sale operation for Interac transactions is VOID (full
      amount, card must be present at terminal). Standard refund is not available for
      Interac.
    capabilities:
      sale:
        rest-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public
      refund:
        rest-api: public
        android-pax: public
