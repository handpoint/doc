        ios-hilite: public
        cordova: public
      reversal:
        rest-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public
      tip-adjustment:
        rest-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: not-supported
        cordova: public
      pre-auth:
        rest-api: public
        android-pax: public
        android-hilite: coming-soon
        ios-hilite: coming-soon
        cordova: public
      moto:
        rest-api: public
        android-pax: not-supported
        android-hilite: not-supported
        ios-hilite: not-supported
        cordova: not-supported
      tokenization:
        rest-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public
      void:
        rest-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public

  tns:
    name: "TNS"
    geography: "Canada"
    status: active
    card-brands: [Interac]
    interac: true
    notes: >
      TNS processes Interac card-present transactions only. The only post-sale operation
      is VOID — full amount, card must be inserted or tapped, must occur before settlement.
      Show VOID in your UI, not Refund. Credit refunds are not supported by Interac network.
      Pre-authorization is explicitly rejected (BAD_REQUEST).
    capabilities:
      sale:
        rest-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public
      void:
        rest-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public

