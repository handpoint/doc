  tns:
    name: "TNS (Interac)"
    geography: "Canada"
    status: deprecated
    card-brands: [Interac]
    interac: true
    notes: >
      TNS processes Interac card-present transactions only. The only post-sale operation
      is VOID — full amount, card must be inserted or tapped, must occur before settlement.
      Show VOID in your UI, not Refund. Credit refunds are not supported by Interac network.
      Pre-authorization is explicitly rejected (BAD_REQUEST).
      Sale with Tip: confirmed in production (1,000+ Interac transactions) — tip is
      included in the authorized total (F4); no separate tip breakdown field sent to TNS.
      Tip adjustment is hard-blocked at the protocol validator.
    capabilities:
      sale:
        cloud-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public
        flavors:
