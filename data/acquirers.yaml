# Handpoint acquirer capabilities — source of truth for generated pages.
# Edit this file, then run: node scripts/generate-acquirer-pages.js
#
# Capability values per integration path:
#   public       — documented with code example
#   coming-soon  — announced, no code shown yet
#   not-supported — cannot work on this path (e.g. MOTO on physical terminal)
#   (absent)     — acquirer does not support this capability at all

acquirers:

  epi:
    name: "EPI"
    geography: "US, Canada"
    status: active
    card-brands: [VISA, MC, Discover]
    interac: false
    notes: >
      EPI (formerly TSYS). Batch auto-closes ~11pm EST (host-capture). Partial
      reversal available for US and Canada — uses the MasterCard flag in ISO 8583.
      Tip adjustment only available on transactions processed without an on-screen tip
      (tip-at-table flow).
    capabilities:
      sale:
        cloud-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public
      refund:
        cloud-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public
      reversal:
        cloud-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public
      partial-reversal:
        cloud-api: public
        android-pax: public
        android-hilite: not-supported
        ios-hilite: not-supported
        cordova: not-supported
      tip-adjustment:
        cloud-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: not-supported
        cordova: public
      pre-auth:
        cloud-api: public
        android-pax: public
        android-hilite: not-supported
        ios-hilite: not-supported
        cordova: public
      moto:
        cloud-api: public
        android-pax: public
        android-hilite: not-supported
        ios-hilite: not-supported
        cordova: not-supported
      tokenization:
        cloud-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public
      batching:
        cloud-api: public
        android-pax: not-supported
        android-hilite: not-supported
        ios-hilite: not-supported
        cordova: not-supported
      pre-auth-capture-reversal:
        cloud-api: public
        android-pax: public
        android-hilite: not-supported
        ios-hilite: not-supported
        cordova: not-supported
  tsys-tns:
    name: "PAYSAFE + Interac"
    geography: "Canada"
    status: active
    card-brands: [VISA, MC, Discover, Interac]
    interac: true
    notes: >
      Gateway routes automatically: Interac cards go to TNS, all other cards go to TSYS.
      IMPORTANT for ISVs: for Interac card transactions, show a VOID button — not Refund
      or Reverse. The only post-sale operation for Interac transactions is VOID (full
      amount, card must be present at terminal). Standard refund is not available for
      Interac.
      BATCHING: Batch close is only available for TSYS (non-Interac) transactions.
      Interac (TNS) transactions settle independently and do not participate in the TSYS
      batch close.
    capabilities:
      sale:
        cloud-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public
      refund:
        cloud-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public
      reversal:
        cloud-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public
      tip-adjustment:
        cloud-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: not-supported
        cordova: public
      pre-auth:
        cloud-api: public
        android-pax: public
        android-hilite: not-supported
        ios-hilite: not-supported
        cordova: public
      moto:
        cloud-api: public
        android-pax: public
        android-hilite: not-supported
        ios-hilite: not-supported
        cordova: not-supported
      tokenization:
        cloud-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public
      batching:
        cloud-api: public
        android-pax: not-supported
        android-hilite: not-supported
        ios-hilite: not-supported
        cordova: not-supported
      void:
        cloud-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public

  tns:
    name: "TNS (Interac)"
    geography: "Canada"
    status: active
    card-brands: [Interac]
    interac: true
    notes: >
      TNS processes Interac card-present transactions only. The only post-sale operation
      is VOID — full amount, card must be inserted or tapped, must occur before settlement.
      Show VOID in your UI, not Refund. Credit refunds are not supported by Interac network.
      Pre-authorization is explicitly rejected (BAD_REQUEST).
    capabilities:
      sale:
        cloud-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public
      void:
        cloud-api: public
        android-pax: public
        android-hilite: public
        ios-hilite: public
        cordova: public

  paysafe-tsys:
    name: "PAYSAFE"
    geography: "US"
    status: active
    card-brands: [VISA, MC, AMEX, Discover, Interac]
    interac: true
    notes: >
      Paysafe uses TSYS + TNS routing infrastructure. MOTO, partial reversal, and
      pre-authorization are not available. Tip adjustment forthcoming.
      Tokenization: single-use Paysafe token — requires merchant onboarding by
