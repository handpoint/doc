            label: "Remote Sale (MOTO)"
            cloud-api: not-supported
            android-pax: public
            cordova: public
            backoffice: public
          sale-and-tip:
            label: "Sale with Tip"
            cloud-api: public
            android-pax: public
            android-hilite: public
            cordova: public
