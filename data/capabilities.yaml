# Capability definitions — single source of truth for the docs generator.
# Edit here, then run: node scripts/generate-acquirer-pages.js
#
# Per-capability keys:
#   heading      — section heading on generated acquirer page (## level)
#   panel-label  — label shown in the AcquirerCapabilitySummary panel;
#                  OMIT for capabilities that are not top-level panel rows
#                  (e.g. partial-reversal is a flavor of reversal, not its own row)
#   partials     — list of .mdx file names under src/partials/functions/ (flat, no subdir)
#   flavors      — map of flavorKey → { description, anchor? }
#                  description: one-liner shown in the FlavorSection summary
#                  anchor: override anchor id (default: the flavor key itself)

capabilities:

  sale:
    heading: "Sale"
    panel-label: "Sale"
    partials: [sale]
    flavors:
      emv-sale:
        description: "On-device · chip, contactless, or magstripe"
      key-entry-sale:
        description: "On-device · operator keys card number"
      moto-sale:
        description: "Back-office · charges a stored card token"
        anchor: remote-sale
      sale-and-tip:
        description: "On-device · tip collected at checkout"
      sale-and-tokenize:
        description: "On-device · stores card token for future charges"
      sale-and-paysafe-token:
        description: "On-device · captures a Paysafe single-use token for Customer Vault API"

  refund:
    heading: "Refund"
    panel-label: "Refund"
    partials: [refund]
    flavors:
      card-present:
        description: "On-device · card present at terminal"
        anchor: emv-refund
      moto-refund:
        description: "Back-office · linked to original MOTO sale"
      key-entry-refund:
        description: "On-device · operator keys card number"

  reversal:
    heading: "Reversal"
    panel-label: "Reversal"
    partials: [reversal]
    flavors:
      reversal:
        description: "On-device · no card required"
      remote-reversal:
        description: "Back-office · no reader required"

  partial-reversal:
    heading: "Partial Reversal"
    # no panel-label — this is a flavor of reversal, not a top-level panel row
    partials: [partial-reversal]
    flavors:
      partial-reversal:
        description: "Partially cancel an open authorization before settlement"

  tip-adjustment:
    heading: "Tip Adjustment"
    panel-label: "Tip Adjustment"
    partials: [tip-adjustment]
    flavors:
      tip-adjustment:
        description: "Post-authorization · adjust tip before batch close"

  pre-auth:
    heading: "Pre-Authorization"
    panel-label: "Pre-Authorization"
    partials: [pre-auth-create, pre-auth-capture, pre-auth-void]
    flavors:
      pre-auth-create:
        description: "On-device · chip, contactless, or magstripe"
        anchor: pre-auth-create
      key-entry-pre-auth:
        description: "On-device · operator keys card number"
        anchor: key-entry-pre-auth
      pre-auth-capture:
        description: "No card required — settle the held amount"
        anchor: pre-auth-capture
      pre-auth-void:
        description: "Release the hold without charging"
        anchor: pre-auth-void
      pre-auth-adjust:
        description: "Raise or lower the held amount before capture"
        anchor: pre-auth-adjust

  pre-auth-capture-reversal:
    heading: "Pre-Auth Capture Reversal"
    panel-label: "Pre-Auth Capture Reversal"
    partials: [pre-auth-capture-void]
    flavors:
      pre-auth-capture-void:
        description: "Void a captured pre-authorization — releases the charge"

  moto:
    heading: "MOTO (Mail Order / Telephone Order)"
    panel-label: "MOTO"
    partials: [moto]
    flavors:
      moto:
        description: "Back-office · mail order / telephone order"

  tokenization:
    heading: "Tokenization"
    panel-label: "Tokenization"
    partials: [tokenization]
    flavors:
      procharge:
        description: "EPI · Cygma vault — MOTO detokenization by gateway; ISV stays out of PCI scope"
      paysafe-token:
        description: "Paysafe · single-use token — for use on Paysafe APIs; consult Paysafe team"
      tokenex:
        description: "3rd-party · TokenEx — loyalty / card-matching; no detokenization through Handpoint"

  batching:
    heading: "Batch Operations"
    panel-label: "Batch Operations"
    partials: [batch-close, batch-summary, batch-detail]
    flavors:
      batch-close:
        description: "Settle the current open batch with the acquirer"
      batch-summary:
        description: "Aggregate totals — transaction count and net amounts by type"
      batch-detail:
        description: "Individual transactions in a batch, paginated (5 per page)"

  money-remittance:
    heading: "Money Remittance"
    panel-label: "Money Remittance"
    partials: [money-remittance]
    flavors:
      money-remittance:
        description: "Send funds to a recipient account"

  void:
    heading: "Void"
    panel-label: "Void"
    partials: [void]
    flavors:
      void:
        description: "Cancel a transaction before settlement — card must be present"

  interac:
    heading: "Interac Card Transactions"
    panel-label: "Interac"
    partials: [interac]
    flavors:
      interac:
        description: "Interac card transactions — full void only, card present required"
